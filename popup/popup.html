<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deadline OS</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <header class="header">
    <div>
      <h1>⏰ Deadline OS</h1>
      <div class="header-sub" id="authStatus">Gmail deadline tracker</div>
    </div>
    <div class="header-actions">
      <button class="scan-btn" id="scanBtn" title="Scan Gmail inbox now">🔍 Scan</button>
      <button class="refresh-btn" id="refreshBtn" title="Refresh">↻</button>
    </div>
  </header>

  <div class="scan-status">
    <span id="scanStatusText">Checking scan status...</span>
    <span class="scan-new" id="scanNewCount" hidden></span>
  </div>

  <!-- Shown only when the Google account is not connected -->
  <div id="authBanner" hidden>
    <span>📅 Connect Google Calendar to auto-create events</span>
    <button id="connectCalBtn">Connect</button>
  </div>

  <main id="content"></main>

  <footer class="footer">
    <div class="footer-stats">
      <div class="footer-stat"><span class="num" id="statTotal">0</span> tracked</div>
      <div class="footer-stat"><span class="num" id="statCompleted">0</span> done this week</div>
      <div class="footer-stat"><span class="num" id="statUpcoming">0</span> upcoming</div>
    </div>
    <button class="clear-btn" id="clearBtn">Clear all</button>
  </footer>

  <script src="../utils/sender-domains.js"></script>
  <script src="popup.js"></script>
</body>
</html>
